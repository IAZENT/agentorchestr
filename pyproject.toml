[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentorchestr"
version = "0.0.0"  # overridden by release workflow from git tag
description = "Agent orchestrator for terminal-based coding agents — discovers installed CLIs, runs them in parallel, ships giant projects in hours"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "agentorchestr contributors" }]
keywords = ["agents", "orchestration", "llm", "tmux", "mcp", "claude", "kiro", "codex"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]

dependencies = [
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "rich>=13.7",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "libtmux>=0.55,<0.60",
]

[project.optional-dependencies]
mcp      = ["mcp>=1.20"]
discover = ["zeroconf>=0.140"]
memory   = ["sqlite-vec>=0.1.6", "fastembed>=0.4"]
research = ["ddgs>=9.0"]
test     = ["pytest>=8.0", "pytest-asyncio>=0.23"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mcp>=1.20",
    "zeroconf>=0.140",
    "sqlite-vec>=0.1.6",
    "fastembed>=0.4",
    "ddgs>=9.0",
]

[project.scripts]
agentorchestr = "agentorchestr.orchestrator:_sync_main"
agentorchestr-shim = "agentorchestr.orch_shim:main"

[project.urls]
Homepage      = "https://github.com/IAZENT/agentorchestr"
Documentation = "https://github.com/IAZENT/agentorchestr#readme"
Repository    = "https://github.com/IAZENT/agentorchestr"
Issues        = "https://github.com/IAZENT/agentorchestr/issues"

[tool.setuptools.packages.find]
# Ship the real package and its sub-packages (agentorchestr/dashboard,
# agentorchestr/memory, agentorchestr/skills).  Everything else is dev
# scaffolding and stays out of the wheel.
include = ["agentorchestr*"]
exclude = ["tests*", "agents*", "dist*", "build*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths    = ["tests"]
